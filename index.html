<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Oficial - Outlet</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.08); text-align: center; text-decoration: none; color: #333; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.12); }
        .card img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; }
        .card h3 { margin: 10px 0 5px; font-size: 1.1rem; }
        .card p { margin: 5px 0; color: #666; font-size: 0.95rem; }
        .precio-ref { text-decoration: line-through; color: #999; font-size: 0.85rem; }
        .precio-out { color: #d9534f; font-weight: bold; font-size: 1.1rem; }
        .btn-main { background: #0056b3; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        .btn-wa { background: #25D366; color: white; padding: 10px; border-radius: 6px; text-decoration: none; display: block; margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        h1 { text-align: center; margin-bottom: 30px; color: #222; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" id="btn-back" class="btn-main" style="display:none;">← Volver</a>
        <h1 id="titulo">Nuestras Categorías</h1>
        <div id="contenedor" class="grid">Cargando catálogo...</div>
    </div>

    <script>
        const WA_NUMERO = "593XXXXXXXXX"; 
        const CSV_URL = "https://docs.google.com/spreadsheets/d/168Qg4rnF4Kjj0Y8RDKzQYov4ek3t0vrtarHTcc9qVxo/gviz/tq?tqx=out:csv&gid=0";

        const METADATA_ESTRUCTURA = {
            "Hogar": { imagen: "./assets/img/cat-hogar.jpg", subcategorias: { "Modulares": { imagen: "./assets/img/sub-modulares.jpg" }, "Decoración": { imagen: "./assets/img/sub-decoracion.jpg" } } },
            "Vestimenta": { imagen: "./assets/img/cat-vestimenta.jpg", subcategorias: { "Para Ellas": { imagen: "./assets/img/sub-ellas.jpg" }, "Para Ellos": { imagen: "./assets/img/sub-ellos.jpg" }, "Para los Peques": { imagen: "./assets/img/sub-peques.jpg" }, "Para mis Mascotas": { imagen: "./assets/img/sub-mascotas.jpg" }, "Deportiva": { imagen: "./assets/img/sub-deportiva.jpg" }, "Coleccionable & Vintage": { imagen: "./assets/img/sub-coleccionable.jpg" }, "Calzado": { imagen: "./assets/img/sub-calzado.jpg" }, "Accesorios": { imagen: "./assets/img/sub-accesorios.jpg" } } },
            "Audio & Video": { imagen: "./assets/img/cat-audiovideo.jpg", subcategorias: { "Portátiles": { imagen: "./assets/img/sub-portatiles.jpg" }, "Sistemas Fijos": { imagen: "./assets/img/sub-sistemasfijos.jpg" } } },
            "Automotriz": { imagen: "./assets/img/cat-automotriz.jpg", subcategorias: { "Mantenimiento & Cuidado": { imagen: "./assets/img/sub-mantenimiento.jpg" }, "Equipamiento & Emergencia": { imagen: "./assets/img/sub-equipamiento.jpg" }, "Protección & Confort": { imagen: "./assets/img/sub-proteccion.jpg" } } },
            "Juegos & Entretenimiento": { imagen: "./assets/img/cat-juegos.jpg", subcategorias: { "Eventos": { imagen: "./assets/img/sub-eventos.jpg" }, "Bebidas Alcohólicas": { imagen: "./assets/img/sub-bebidas.jpg" }, "Juegos": { imagen: "./assets/img/sub-juegosmesa.jpg" } } },
            "Higiene & Cuidado Personal": { imagen: "./assets/img/cat-higiene.jpg", subcategorias: { "Make-up": { imagen: "./assets/img/sub-makeup.jpg" }, "Personal Care": { imagen: "./assets/img/sub-personalcare.jpg" }, "Wellness (Nutrición)": { imagen: "./assets/img/sub-wellness.jpg" } } }
        };

        // PARSER ROBUSTO: Permite celdas con comas (Ej: "Vestimenta, Hogar")
        function parseCSV(text) {
            const result = [];
            const rows = text.split('\n').filter(row => row.trim().length > 0);
            if (rows.length === 0) return result;

            const parseRow = (row) => {
                let cols = [];
                let inQuotes = false;
                let col = '';
                for (let i = 0; i < row.length; i++) {
                    let char = row[i];
                    if (char === '"') {
                        if (inQuotes && row[i+1] === '"') { col += '"'; i++; } // Comilla escapada
                        else { inQuotes = !inQuotes; }
                    } else if (char === ',' && !inQuotes) {
                        cols.push(col.trim()); col = '';
                    } else { col += char; }
                }
                cols.push(col.trim());
                return cols;
            };

            const headers = parseRow(rows[0]).map(h => h.replace(/^"|"$/g, ''));

            for (let i = 1; i < rows.length; i++) {
                const cols = parseRow(rows[i]);
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = cols[j] || '';
                }

                // Aquí se activa la transversalidad: divide por comas y crea un array de atributos
                obj.categorias = obj.categorias ? obj.categorias.split(',').map(c => c.trim()) : [];
                obj.subcategorias = obj.subcategorias ? obj.subcategorias.split(',').map(s => s.trim()) : [];
                
                obj.stock = Number(obj.stock) || 0;
                obj.precio_referencial = Number(obj.precio_referencial) || 0;
                obj.precio_outlet = Number(obj.precio_outlet) || 0;
                result.push(obj);
            }
            return result;
        }

        const params = new URLSearchParams(window.location.search);
        const catFiltro = params.get('cat');
        const subFiltro = params.get('sub');

        fetch(CSV_URL)
            .then(res => {
                if (!res.ok) throw new Error('Servidor respondió con código: ' + res.status);
                return res.text();
            })
            .then(csvText => {
                const productosActivos = parseCSV(csvText).filter(p => p.stock > 0);
                const cont = document.getElementById('contenedor');
                const tit = document.getElementById('titulo');
                const btn = document.getElementById('btn-back');

                cont.innerHTML = '';

                if (catFiltro && subFiltro) {
                    tit.innerText = `${catFiltro} / ${subFiltro}`;
                    btn.style.display = "inline-block";
                    btn.href = `?cat=${encodeURIComponent(catFiltro)}`;
                    productosActivos.filter(p => p.categorias.includes(catFiltro) && p.subcategorias.includes(subFiltro)).forEach(p => {
                        cont.innerHTML += `<div class="card"><img src="${p.imagen_url}" onerror="this.src='https://via.placeholder.com/240x160?text=Sin+Imagen'"><div class="card-body"><h3>${p.nombre}</h3><p class="precio-ref">Ref: $${p.precio_referencial.toFixed(2)}</p><p class="precio-out">Outlet: $${p.precio_outlet.toFixed(2)}</p><a href="https://wa.me/${WA_NUMERO}?text=${encodeURIComponent(p.mensaje_compra)}" class="btn-wa">Comprar por WhatsApp</a></div></div>`;
                    });
                } else if (catFiltro) {
                    tit.innerText = catFiltro;
                    btn.style.display = "inline-block";
                    btn.href = "index.html";
                    const subsDisponibles = new Set();
                    productosActivos.filter(p => p.categorias.includes(catFiltro)).forEach(p => p.subcategorias.forEach(s => subsDisponibles.add(s)));
                    if (subsDisponibles.size === 0) {
                        cont.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">No hay subcategorías con stock disponible.</p>`;
                    } else {
                        subsDisponibles.forEach(s => {
                            const imgFija = METADATA_ESTRUCTURA[catFiltro]?.subcategorias[s]?.imagen || 'https://via.placeholder.com/240x160?text=' + encodeURIComponent(s);
                            cont.innerHTML += `<a href="?cat=${encodeURIComponent(catFiltro)}&sub=${encodeURIComponent(s)}" class="card"><img src="${imgFija}" onerror="this.src='https://via.placeholder.com/240x160?text=Subcategoría'"><div class="card-body"><h3>${s}</h3><p style="color:#0056b3; font-weight:bold;">Ver productos →</p></div></a>`;
                        });
                    }
                } else {
                    const catsDisponibles = new Set();
                    productosActivos.forEach(p => p.categorias.forEach(c => catsDisponibles.add(c)));
                    catsDisponibles.forEach(c => {
                        const imgFija = METADATA_ESTRUCTURA[c]?.imagen || 'https://via.placeholder.com/240x160?text=' + encodeURIComponent(c);
                        cont.innerHTML += `<a href="?cat=${encodeURIComponent(c)}" class="card"><img src="${imgFija}" onerror="this.src='https://via.placeholder.com/240x160?text=Categoría'"><div class="card-body"><h3>${c}</h3><p style="color:#0056b3; font-weight:bold;">Ver subcategorías →</p></a>`;
                    });
                }
            })
            .catch(err => {
                document.getElementById('contenedor').innerHTML = `
                    <div style="grid-column: 1/-1; padding: 20px; color: red; border: 2px solid red; border-radius: 12px; background: #fff0f0; margin-top: 20px;">
                        <h3 style="margin-top:0;">⚠️ Error de Conexión</h3>
                        <p>No se pudieron cargar los datos del inventario.</p>
                        <p style="font-weight:bold;">Detalle:</p>
                        <p style="font-size: 0.9em;">${err.message}</p>
                    </div>`;
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Oficial - Outlet</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.08); text-align: center; text-decoration: none; color: #333; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.12); }
        .card img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; }
        .card h3 { margin: 10px 0 5px; font-size: 1.1rem; }
        .card p { margin: 5px 0; color: #666; font-size: 0.95rem; }
        .precio-ref { text-decoration: line-through; color: #999; font-size: 0.85rem; }
        .precio-out { color: #d9534f; font-weight: bold; font-size: 1.1rem; }
        .btn-main { background: #0056b3; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        .btn-wa { background: #25D366; color: white; padding: 10px; border-radius: 6px; text-decoration: none; display: block; margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        h1 { text-align: center; margin-bottom: 30px; color: #222; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" id="btn-back" class="btn-main" style="display:none;">← Volver</a>
        <h1 id="titulo">Nuestras Categorías</h1>
        <div id="contenedor" class="grid">Cargando catálogo...</div>
    </div>

    <script>
        const WA_NUMERO = "593XXXXXXXXX"; 
        const CSV_URL = "https://docs.google.com/spreadsheets/d/168Qg4rnF4Kjj0Y8RDKzQYov4ek3t0vrtarHTcc9qVxo/gviz/tq?tqx=out:csv&gid=0";

        function parseCSV(text) {
            const result = [];
            const rows = text.split('\n').filter(row => row.trim().length > 0);
            if (rows.length === 0) return result;

            const parseRow = (row) => {
                let cols = [];
                let inQuotes = false;
                let col = '';
                for (let i = 0; i < row.length; i++) {
                    let char = row[i];
                    if (char === '"') {
                        if (inQuotes && row[i+1] === '"') { col += '"'; i++; } 
                        else { inQuotes = !inQuotes; }
                    } else if (char === ',' && !inQuotes) {
                        cols.push(col.trim()); col = '';
                    } else { col += char; }
                }
                cols.push(col.trim());
                return cols;
            };

            const headers = parseRow(rows[0]).map(h => h.replace(/^"|"$/g, '').toLowerCase());

            for (let i = 1; i < rows.length; i++) {
                const cols = parseRow(rows[i]);
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = cols[j] || '';
                }

                // Lee la nueva columna "rutas" y la separa
                // Ejemplo de ruta: "Vestimenta > Deportiva"
                obj.rutas_array = obj.rutas ? obj.rutas.split(',').map(r => r.trim()) : [];
                obj.stock = Number(obj.stock) || 0;
                obj.precio_referencial = Number(obj.precio_referencial) || 0;
                obj.precio_outlet = Number(obj.precio_outlet) || 0;
                result.push(obj);
            }
            return result;
        }

        // Función auxiliar para verificar si un producto pertenece a la ruta consultada
        function perteneceARuta(producto, categoria, subcategoria) {
            return producto.rutas_array.some(ruta => {
                const partes = ruta.split('>').map(p => p.trim());
                if (subcategoria) {
                    return partes[0] === categoria && partes[1] === subcategoria;
                }
                return partes[0] === categoria;
            });
        }

        const params = new URLSearchParams(window.location.search);
        const catFiltro = params.get('cat');
        const subFiltro = params.get('sub');

        fetch(CSV_URL)
            .then(res => res.text())
            .then(csvText => {
                const productosActivos = parseCSV(csvText).filter(p => p.stock > 0);
                const cont = document.getElementById('contenedor');
                const tit = document.getElementById('titulo');
                const btn = document.getElementById('btn-back');

                cont.innerHTML = '';

                // NIVEL 3: VISTA DE PRODUCTOS
                if (catFiltro && subFiltro) {
                    tit.innerText = `${catFiltro} / ${subFiltro}`;
                    btn.style.display = "inline-block";
                    btn.href = `?cat=${encodeURIComponent(catFiltro)}`;
                    
                    const productosFiltrados = productosActivos.filter(p => perteneceARuta(p, catFiltro, subFiltro));

                    if (productosFiltrados.length === 0) {
                        cont.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">No hay productos disponibles en esta sección actualmente.</p>`;
                    } else {
                        productosFiltrados.forEach(p => {
                            cont.innerHTML += `<div class="card"><img src="${p.imagen_url}" onerror="this.src='https://via.placeholder.com/240x160?text=Sin+Imagen'"><div class="card-body"><h3>${p.nombre}</h3><p class="precio-ref">Ref: $${p.precio_referencial.toFixed(2)}</p><p class="precio-out">Outlet: $${p.precio_outlet.toFixed(2)}</p><a href="https://wa.me/${WA_NUMERO}?text=${encodeURIComponent(p.mensaje_compra)}" class="btn-wa">Comprar por WhatsApp</a></div></div>`;
                        });
                    }

                // NIVEL 2: VISTA DE SUBCATEGORÍAS
                } else if (catFiltro) {
                    tit.innerText = catFiltro;
                    btn.style.display = "inline-block";
                    btn.href = "index.html";
                    
                    const subsDisponibles = new Set();
                    
                    productosActivos.forEach(p => {
                        p.rutas_array.forEach(ruta => {
                            const partes = ruta.split('>').map(p => p.trim());
                            // Si la categoría coincide y existe una subcategoría, la añade
                            if (partes[0] === catFiltro && partes[1]) {
                                subsDisponibles.add(partes[1]);
                            }
                        });
                    });

                    if (subsDisponibles.size === 0) {
                        cont.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">No hay subcategorías con stock disponible.</p>`;
                    } else {
                        subsDisponibles.forEach(s => {
                            // Al ser dinámico, generamos una imagen placeholder con el nombre de la subcategoría
                            const imgFija = `https://via.placeholder.com/240x160?text=${encodeURIComponent(s)}`;
                            cont.innerHTML += `<a href="?cat=${encodeURIComponent(catFiltro)}&sub=${encodeURIComponent(s)}" class="card"><img src="${imgFija}"><div class="card-body"><h3>${s}</h3><p style="color:#0056b3; font-weight:bold;">Ver productos →</p></div></a>`;
                        });
                    }

                // NIVEL 1: VISTA DE CATEGORÍAS PRINCIPALES
                } else {
                    const catsDisponibles = new Set();
                    
                    productosActivos.forEach(p => {
                        p.rutas_array.forEach(ruta => {
                            const partes = ruta.split('>').map(p => p.trim());
                            if (partes[0]) {
                                catsDisponibles.add(partes[0]);
                            }
                        });
                    });

                    if (catsDisponibles.size === 0) {
                        cont.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">El catálogo se encuentra vacío por el momento.</p>`;
                    } else {
                        catsDisponibles.forEach(c => {
                            const imgFija = `https://via.placeholder.com/240x160?text=${encodeURIComponent(c)}`;
                            cont.innerHTML += `<a href="?cat=${encodeURIComponent(c)}" class="card"><img src="${imgFija}"><div class="card-body"><h3>${c}</h3><p style="color:#0056b3; font-weight:bold;">Ver subcategorías →</p></a>`;
                        });
                    }
                }
            })
            .catch(err => {
                document.getElementById('contenedor').innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">Error al cargar datos de inventario.</p>`;
            });
    </script>
</body>
</html>

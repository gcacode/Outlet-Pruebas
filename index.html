<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Premium - Outlet</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9f9f9; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; text-decoration: none; color: #333; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); }
        .btn-main { background: #0066cc; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        .btn-wa { background: #25D366; color: white; padding: 10px; border-radius: 6px; text-decoration: none; display: block; margin-top: 10px; font-weight: bold; }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

    <div style="max-width: 1100px; margin: 0 auto;">
        <a href="index.html" id="btn-back" class="btn-main" style="display:none;">← Volver</a>
    </div>

    <h1 id="titulo" style="text-align:center;">Nuestras Categorías</h1>
    <div id="contenedor" class="grid"></div>

    <script>
        const WA_NUMERO = "593XXXXXXXXX"; // <--- CAMBIA TU NÚMERO AQUÍ
        const params = new URLSearchParams(window.location.search);
        const catFiltro = params.get('cat');
        const subFiltro = params.get('sub');

        fetch('inventario.json').then(r => r.json()).then(data => {
            const cont = document.getElementById('contenedor');
            const tit = document.getElementById('titulo');
            const btn = document.getElementById('btn-back');

            // Nivel 3: Productos (SKU)
            if (catFiltro && subFiltro) {
                tit.innerText = `${catFiltro} / ${subFiltro}`;
                btn.style.display = "inline-block";
                btn.href = `?cat=${encodeURIComponent(catFiltro)}`;
                
                data.filter(p => p.categorias.includes(catFiltro) && p.subcategorias.includes(subFiltro))
                    .forEach(p => {
                        cont.innerHTML += `<div class="card">
                            <img src="${p.imagen_url}" onerror="this.src='https://via.placeholder.com/200'">
                            <h3>${p.nombre}</h3>
                            <p>Outlet: $${p.precio_outlet.toFixed(2)}</p>
                            <a href="https://wa.me/${WA_NUMERO}?text=${encodeURIComponent(p.mensaje_compra)}" class="btn-wa">Comprar</a>
                        </div>`;
                });
            }
            // Nivel 2: Subcategorías
            else if (catFiltro) {
                tit.innerText = catFiltro;
                btn.style.display = "inline-block";
                btn.href = "index.html";
                const subs = new Set();
                data.filter(p => p.categorias.includes(catFiltro)).forEach(p => p.subcategorias.forEach(s => subs.add(s)));
                subs.forEach(s => {
                    cont.innerHTML += `<a href="?cat=${encodeURIComponent(catFiltro)}&sub=${encodeURIComponent(s)}" class="card"><h3>${s}</h3><p>Ver productos →</p></a>`;
                });
            }
            // Nivel 1: Categorías
            else {
                const cats = new Set();
                data.forEach(p => p.categorias.forEach(c => cats.add(c)));
                cats.forEach(c => {
                    cont.innerHTML += `<a href="?cat=${encodeURIComponent(c)}" class="card"><h3>${c}</h3><p>Ver subcategorías →</p></a>`;
                });
            }
        });
    </script>
</body>
</html>
